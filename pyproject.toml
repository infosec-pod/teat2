[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vendorwatch"
version = "0.1.0"
description = "Continuous third-party / technology risk monitoring: CVEs, exploits, patches, breach news for the vendors you choose."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vendorwatch = "vendorwatch.cli:main"

[tool.setuptools.packages.find]
include = ["vendorwatch*"]

# Who the threat briefs are written for
# ---------------------------------------------------------------------------
# DRAFT - review and correct. Claude uses this to judge what a vendor incident
# means for SIAA specifically, so accuracy here directly drives brief quality.
organization:
  name: SIAA
  description: >
    SIAA (Strategic Insurance Agency Alliance) is a national alliance of independent
    property & casualty insurance agencies. It provides member agencies with carrier
    access, business services and technology, and handles agency, carrier and policy
    data on their behalf.
  data_handled:
    - member agency business, contract and financial data
    - insurance client PII (names, contact details, policy and claims information)
    - commission and carrier data
    - employee data
  regulations:
    - GLBA Safeguards Rule (customer information security)
    - state insurance data security laws based on the NAIC Insurance Data Security Model Law
    - NYDFS 23 NYCRR 500 (if licensed in New York)
    - state data breach notification laws
  notes: Confirm the list above with Legal/Compliance.

# Claude-written threat brief for each alert
# ---------------------------------------------------------------------------
# Needs ANTHROPIC_API_KEY (GitHub secret). Roughly $0.20-0.40 per brief.
# Each vendor's `usage:` (how SIAA uses it / what data it shares) sharpens the
# briefs; Drata fills it from "services provided" and "data stored".
briefs:
  enabled: true
  model: claude-opus-5-5
  research: true            # let Claude read the sources with web search / fetch first
  max_searches: 5           # per brief
  max_per_run: 10           # cost cap; the rest are briefed on later runs
  write_markdown: true      # also save each brief as briefs/<vendor>/<date>-<title>.md
  dir: briefs
  in_dashboard: true        # set false if the dashboard is published to a PUBLIC GitHub Pages site

# Drata vendor inventory sync
# ---------------------------------------------------------------------------
# Drata decides WHICH vendors are monitored and HOW critical they are:
#   - new vendors in Drata are picked up automatically (name + website domain)
#   - vendors whose status isn't listed below (e.g. OFFBOARDED, ARCHIVED) stop being monitored
#   - criticality comes from Drata's risk level / critical flag / impact level
# The entries above still apply: they fine-tune matching vendors (keywords,
# domains, SEC ids) and keep anything Drata doesn't track (e.g. technologies).
# Preview the mapping with:  python -m vendorwatch drata
drata:
  enabled: true
  api_key: ${DRATA_API_KEY}     # Drata > Settings > API Keys; needs "Vendors: List Vendors"
  region: us                    # us | eu | apac
  statuses: [ACTIVE, APPROVED, UNDER_REVIEW, FLAGGED, ON_HOLD]
  criticality_source: drata     # drata | yaml
  keep_unmatched_yaml: true     # keep YAML entries that aren't in Drata
  exclude: []                   # Drata vendor names to never monitor

settings:
  db_path: data/vendorwatch.db
  report_path: report.html
  lookback_days: 30
  news_days: 14              # first scan looks back 2 weeks of news
  alert_min_priority: P2     # breach / exploit news is P2, so it gets alerted
  alert_on_news: true
  news_title_match: true     # ignore Google News hits where the headline doesn't name the vendor
  # NVD API key - read from the NVD_API_KEY environment variable / GitHub secret.
  # Never paste the key itself here: this file is committed to the repo.
  nvd_api_key: ${NVD_API_KEY}
  # SEC asks automated clients to identify themselves: "Company Name security@company.com"
  sec_user_agent: ${SEC_USER_AGENT}
  cluster_days: 14           # group repeat coverage of the same story within 2 weeks
  max_cveorg_lookups: 40
  max_github_lookups: 20
  global_feeds:
    - https://www.bleepingcomputer.com/feed/
    - https://feeds.feedburner.com/TheHackersNews
    - https://www.securityweek.com/feed/
  sources:
    nvd: true
    kev: true
    epss: true
    cveorg: true
    google_news: true
    exploitdb: true
    github_poc: true
    ransomware: true         # ransomware.live leak-site monitoring
    sec: true                # SEC EDGAR 8-K cyber disclosures

notify:
  slack:
    webhook_url: ${SLACK_WEBHOOK_URL}
  teams:
    webhook_url: ${TEAMS_WEBHOOK_URL}
  webhook:
    url: ${VENDORWATCH_WEBHOOK_URL}
  email:
    smtp_host: ${SMTP_HOST}
    smtp_port: ${SMTP_PORT:-587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    from: ${SMTP_FROM}
    to: ${ALERT_EMAIL_TO}
